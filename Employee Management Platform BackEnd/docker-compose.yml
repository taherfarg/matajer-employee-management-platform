services:
  postgres:
    image: postgres:17-alpine
    container_name: ems-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ems
      POSTGRES_PASSWORD: ems_local_password
      POSTGRES_DB: ems
    ports:
      - "5433:5432"
    volumes:
      - ems-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ems -d ems"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Separate database used by the integration test suite so `npm test`
  # never destroys the demo data in the development database.
  postgres-test:
    image: postgres:17-alpine
    container_name: ems-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: ems
      POSTGRES_PASSWORD: ems_local_password
      POSTGRES_DB: ems_test
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ems -d ems_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ems-pgdata:
